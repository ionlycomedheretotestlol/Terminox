name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional: set these repo secrets to sign releases with your own key
      # (so updates install over each other). Without them the APK uses a debug key.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMINOX_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TERMINOX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          TERMINOX_KEYSTORE_PASSWORD: ${{ secrets.TERMINOX_KEYSTORE_PASSWORD }}
          TERMINOX_KEY_ALIAS: ${{ secrets.TERMINOX_KEY_ALIAS }}
          TERMINOX_KEY_PASSWORD: ${{ secrets.TERMINOX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease && cp app/build/outputs/apk/release/app-release.apk terminox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: terminox-apk
          path: terminox.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: terminox.apk
          generate_release_notes: true
